<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Animation Reel — Marius Bejinariu</title>
<meta name="description" content="Motion graphics and 3D animation reel by Marius Bejinariu."/>
<!-- STAGE 4 (CHANGED): the list of typefaces this page asks Google Fonts for.
     • Space Grotesk gained its bold weight (the 700 at the end): the headings use it now.
     • Playfair Display used to be asked for in five styles. Only its heaviest one (900) is
       still used, for the titles on the film strips, so the other four are no longer downloaded. -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&family=Space+Mono:wght@400;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root {
  --red:#ff1a3c; --pink:#ff4d7a;
  --bg:#070707; --surf:#0f0f0f; --border:#1e1e1e;
  --text:#e2e2e2; --muted:#aaa; --body-lh:1.72;
  --paper:#0d0d0d; --paper2:#111; --ink:#e2e2e2;
  --serif:'Playfair Display',Georgia,serif;
  --mono:'Space Mono',monospace;
  --sans:'Space Grotesk',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:var(--sans);}

/* ══════════════════════════════════════════
   REEL LIST VIEW
══════════════════════════════════════════ */
#gallery-view{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);z-index:1;overflow-y:auto;}
header.gh{display:flex;align-items:center;justify-content:space-between;padding:0 48px;height:60px;border-bottom:1px solid var(--border);background:var(--nav-bg);position:sticky;top:0;z-index:10;flex-shrink:0;}
.back-link{font-family:var(--mono);font-size:11px;letter-spacing:.5px;color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:11px;border:1px solid transparent;background:linear-gradient(135deg,var(--pink),var(--red));box-shadow:0 6px 16px rgba(255,26,60,.32);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:color .2s,border-color .2s,background .25s,transform .2s,box-shadow .25s;}
.back-link svg{width:14px;height:14px;stroke:currentColor;fill:none;transition:transform .2s;}
.back-link:hover{color:var(--text-2,#ccc);border-color:var(--bar-border,#2a2a2a);background:var(--bar-bg,rgba(7,7,7,.85));box-shadow:none;transform:translateY(0);}
.back-link:hover svg{transform:translateX(-3px);}
.gh-title{font-family:var(--mono);font-size:13px;color:var(--red);letter-spacing:1px;}
.gh-counter{font-family:var(--mono);font-size:12px;color:var(--muted);}
.gallery-main{flex:1;padding:48px;}
.gallery-intro{text-align:center;margin-bottom:48px;}
.gallery-intro h1{font-family:var(--serif);font-size:clamp(28px,4vw,52px);color:var(--text-strong);margin-bottom:12px;font-style:italic;}
.gallery-intro p{font-size:14px;color:var(--muted);max-width:500px;margin:0 auto;line-height:var(--body-lh);}
/* ── FILM STRIP CARDS ── */
.gallery-grid{
  display:flex;
  justify-content:center;
  align-items:flex-end;
  max-width:1100px;
  margin:0 auto;
  padding:60px 0 80px;
  position:relative;
  height:520px;
  perspective:900px;
}

.gallery-card{
  flex:0 0 auto;
  width:200px;
  cursor:pointer;
  position:absolute;
  transition:transform .45s cubic-bezier(.23,1,.32,1), filter .45s;
  transform-style:preserve-3d;
}
.gallery-card:nth-child(1){
  transform: translateX(-180px) translateY(32px) rotateY(18deg) rotateZ(-4deg) scale(0.88);
  filter:drop-shadow(-8px 24px 36px rgba(0,0,0,.85));
  z-index:1;
}
.gallery-card:nth-child(1):hover{
  transform: translateX(-180px) translateY(8px) rotateY(18deg) rotateZ(-4deg) scale(0.93);
  filter:drop-shadow(-12px 32px 48px rgba(0,0,0,.9));
  z-index:4;
}
.gallery-card:nth-child(2){
  transform: translateX(0px) translateY(0px) scale(1.0);
  filter:drop-shadow(0 32px 52px rgba(0,0,0,.9));
  z-index:3;
}
.gallery-card:nth-child(2):hover{
  transform: translateX(0px) translateY(-20px) scale(1.06);
  filter:drop-shadow(0 44px 68px rgba(0,0,0,.95));
  z-index:4;
}
.gallery-card:nth-child(3){
  transform: translateX(180px) translateY(32px) rotateY(-18deg) rotateZ(4deg) scale(0.88);
  filter:drop-shadow(8px 24px 36px rgba(0,0,0,.85));
  z-index:2;
}
.gallery-card:nth-child(3):hover{
  transform: translateX(180px) translateY(8px) rotateY(-18deg) rotateZ(4deg) scale(0.93);
  filter:drop-shadow(12px 32px 48px rgba(0,0,0,.9));
  z-index:4;
}

/* ── FILM STRIP BODY ── */
.film-strip{
  width:200px;
  background:#0d0d0d;
  border:2px solid #222;
  border-radius:4px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  position:relative;
}

/* sprocket row — top and bottom */
.sprocket-row{
  height:22px;
  background:#ffffff;
  display:flex;
  align-items:center;
  justify-content:space-around;
  padding:0 6px;
  flex-shrink:0;
  border-top:1px solid #ddd;
  border-bottom:1px solid #ddd;
}
.sprocket-hole{
  width:12px;
  height:10px;
  background:#111;
  border-radius:2px;
  border:1px solid #333;
  flex-shrink:0;
}

/* film header label */
.film-header{
  background:#0a0a0a;
  padding:8px 12px 6px;
  border-bottom:2px solid var(--red);
  flex-shrink:0;
}
.film-header-brand{
  font-family:var(--mono);
  font-size:7px;
  color:#ffffff;
  letter-spacing:3px;
  text-transform:uppercase;
  margin-bottom:2px;
}
.film-header-title{
  font-family:var(--serif);
  font-size:15px;
  font-weight:900;
  color:#fff;
  line-height:1;
  text-transform:uppercase;
  letter-spacing:-0.3px;
}
.film-header-sub{
  font-family:var(--mono);
  font-size:7px;
  color:var(--red);
  letter-spacing:2px;
  margin-top:3px;
}

/* main frame — the big video/image area */
.film-frame{
  position:relative;
  margin:0;
  height:230px;
  flex-shrink:0;
  background:#000;
  overflow:hidden;
  cursor:pointer;
}
.film-frame video,
.film-frame img{
  position:absolute;inset:0;
  width:100%;height:230px;
  object-fit:cover;
  display:block;
  opacity:.85;
  z-index:1;
  transition:transform .4s, opacity .3s;
}
.gallery-card:hover .film-frame video,
.gallery-card:hover .film-frame img{ transform:scale(1.04); opacity:1; }

/* frame border lines — inner white rule lines like real film */
.film-frame::before,
.film-frame::after{
  content:'';
  position:absolute;
  left:0;right:0;
  height:3px;
  background:rgba(255,255,255,.08);
  z-index:2;
  pointer-events:none;
}
.film-frame::before{ top:0; }
.film-frame::after{ bottom:0; }

/* placeholder inside frame */
.film-frame-ph{
  width:100%;height:230px;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:10px;
  background:repeating-linear-gradient(135deg,#111,#111 10px,#0d0d0d 10px,#0d0d0d 20px);
}
.film-play-btn{
  width:52px;height:52px;
  border:2px solid rgba(255,26,60,.4);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  transition:border-color .2s, background .2s;
  position:relative;
}
.film-play-btn::after{
  content:'';
  width:0;height:0;
  border-style:solid;
  border-width:10px 0 10px 18px;
  border-color:transparent transparent transparent rgba(255,26,60,.6);
  margin-left:4px;
}
.film-frame:hover .film-play-btn{
  border-color:var(--red);
  background:rgba(255,26,60,.08);
}
.film-frame-ph-label{
  font-family:var(--mono);font-size:8px;color:#444;
  letter-spacing:1.5px;text-transform:uppercase;
}
.film-frame-ph-file{
  font-family:var(--mono);font-size:7px;color:#2a2a2a;
  border:1px dashed #222;padding:3px 8px;
}

/* metadata strip */
.film-meta{
  background:#0a0a0a;
  border-top:2px solid var(--red);
  padding:7px 12px;
  flex-shrink:0;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.film-meta-tags{
  display:flex;flex-direction:column;gap:2px;
}
.film-meta-tag{
  font-family:var(--mono);font-size:7px;color:#ffffff;
  letter-spacing:.5px;
}
.film-meta-num{
  font-family:var(--mono);font-size:18px;font-weight:700;
  color:#ffffff;line-height:1;
  -webkit-text-stroke:none;
  border:1px solid #ffffff;
  padding:2px 4px;
}

/* exposed frame strips at top/bottom — mini thumbnail frames */
.film-thumbs{
  display:flex;
  background:#080808;
  border-top:1px solid #1a1a1a;
  flex-shrink:0;
}
.film-thumb-cell{
  flex:1;
  height:0px;
  border-right:1px solid #1a1a1a;
  background:#0d0d0d;
  position:relative;
  overflow:hidden;
}
.film-thumb-cell:last-child{ border-right:none; }
.film-thumb-cell::after{
  content:'';
  position:absolute;inset:0;
  background:rgba(255,26,60,.03);
}

/* open label */
.mag-cover-open{
  text-align:center;padding:10px 0 0;
  font-family:var(--mono);font-size:9px;color:rgba(255,26,60,.45);
  letter-spacing:1px;transition:color .2s;
}
.gallery-card:hover .mag-cover-open{ color:var(--red); }

/* ══════════════════════════════════════════
   VIEWER OVERLAY
══════════════════════════════════════════ */
#mag-overlay{
  position:fixed;inset:0;z-index:100;
  background:var(--overlay-bg);backdrop-filter:blur(24px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .4s,background-color .35s ease;
}
#mag-overlay.open{opacity:1;pointer-events:auto;}

.mag-chrome{
  position:absolute;top:0;left:0;right:0;height:56px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 32px 0 84px;z-index:10;border-bottom:1px solid var(--border);
  background:var(--chrome-bg);backdrop-filter:blur(8px);
}
.mag-back{font-family:var(--mono);font-size:11px;letter-spacing:.5px;color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--pink),var(--red));border:1px solid transparent;border-radius:11px;padding:8px 14px;display:inline-flex;align-items:center;gap:8px;box-shadow:0 6px 16px rgba(255,26,60,.32);transition:color .2s,border-color .2s,background .25s,transform .2s,box-shadow .25s;}
.mag-back svg{width:14px;height:14px;stroke:currentColor;fill:none;transition:transform .2s;}
.mag-back:hover{color:var(--text-2,#ccc);border-color:var(--bar-border,#2a2a2a);background:var(--bar-bg,rgba(7,7,7,.85));box-shadow:none;transform:translateY(0);}
.mag-back:hover svg{transform:translateX(-3px);}
.mag-issue-label{font-family:var(--serif);font-size:13px;color:var(--muted);font-style:italic;}
.mag-progress-wrap{display:flex;align-items:center;gap:12px;}
.mag-page-num{font-family:var(--mono);font-size:11px;color:var(--muted);}
.mag-progress{width:100px;height:2px;background:var(--track);border-radius:2px;overflow:hidden;}
.mag-progress-fill{height:100%;background:var(--red);transition:width .4s;}

/* stage */
.mag-stage{
  width:min(960px,94vw);height:min(640px,82vh);
  position:relative;perspective:2000px;
}

/* nav arrows — UI-kit rounded button, visible red glyph, gradient hover */
.mag-arrow{
  position:absolute;top:50%;transform:translateY(-50%);
  width:48px;height:48px;border-radius:13px;
  border:1px solid var(--bar-border);background:var(--bar-bg);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  z-index:20;box-shadow:0 6px 18px rgba(0,0,0,.35);
  transition:border-color .2s,background .25s,box-shadow .25s,transform .2s;
}
.mag-arrow svg{stroke:var(--red);width:18px;height:18px;transition:stroke .2s,transform .2s;}
.mag-arrow:hover{border-color:transparent;background:linear-gradient(135deg,var(--pink),var(--red));box-shadow:0 10px 26px rgba(255,26,60,.4),0 0 0 1px rgba(255,26,60,.3);transform:translateY(-50%) scale(1.07);}
.mag-arrow:hover svg{stroke:#fff;}
.mag-arrow.prev:hover svg{transform:translateX(-2px);}
.mag-arrow.next:hover svg{transform:translateX(2px);}
.mag-arrow[disabled]{opacity:.2;pointer-events:none;}
.mag-arrow.prev{left:-64px;}
.mag-arrow.next{right:-64px;}

/* book */
.book{width:100%;height:100%;position:relative;transform-style:preserve-3d;}

/* pages */
.page{
  position:absolute;inset:0;
  transform-origin:left center;
  transform-style:preserve-3d;
  transition:transform .72s cubic-bezier(.645,.045,.355,1);
  backface-visibility:hidden;
}
.page-front{position:absolute;inset:0;backface-visibility:hidden;overflow:hidden;box-shadow:6px 0 32px rgba(0,0,0,.7);}
.page-shadow{position:absolute;inset:0;background:linear-gradient(to right,rgba(0,0,0,0),rgba(0,0,0,.4));pointer-events:none;opacity:0;transition:opacity .35s;z-index:5;}
.page.flipping .page-shadow{opacity:1;}
.page-num-corner{position:absolute;bottom:10px;right:14px;font-family:var(--mono);font-size:9px;color:#666;z-index:3;}

/* ══════════════════════════════════════════
   PAGE LAYOUTS — dark cinematic theme
══════════════════════════════════════════ */

/* COVER */
.p-cover{background:#000;color:#fff;display:flex;flex-direction:column;height:100%;overflow:hidden;position:relative;}
.p-cover .cover-video-wrap{flex:1;position:relative;overflow:hidden;background:#111;min-height:0;}
.p-cover .cover-video-wrap video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.7;}
.p-cover .cover-ph{width:100%;height:100%;background:repeating-linear-gradient(135deg,#111,#111 12px,#0d0d0d 12px,#0d0d0d 24px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
.p-cover .cover-ph svg{opacity:.35;}
.p-cover .cover-ph-label{font-family:var(--mono);font-size:9px;color:#777;letter-spacing:1px;}
.p-cover .cover-ph-file{font-family:var(--mono);font-size:11px;color:rgba(255,26,60,.3);border:1px dashed rgba(255,26,60,.15);padding:6px 14px;}
.p-cover .cover-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.9) 0%,transparent 50%);pointer-events:none;}
/* FIXED: the words on a cover page (small red label, title, and the line under it) were dim.
   Why: the cover's video is given layer number 1 (the style="z-index:1" on its <video> tag,
   further down in renderPage). This block of words had no layer number, so the see-through
   video was drawn ON TOP of the words and dimmed them.
   What changed: two things were added at the end of the next rule.
   • z-index:2 puts the words one layer in front of the video. The video itself is not
     touched. The page number (layer 3) and the page-turn shadow (layer 5) are still on top.
   • pointer-events:none makes clicks and taps pass straight through the words to the video
     underneath, exactly as before, so clicking or swiping on a cover behaves as it always did. */
.p-cover .cover-footer{position:absolute;bottom:0;left:0;right:0;padding:24px 28px;z-index:2;pointer-events:none;}
.p-cover .cover-issue{font-family:var(--mono);font-size:9px;letter-spacing:3px;color:var(--red);margin-bottom:8px;}
.p-cover .cover-title{font-family:var(--serif);font-size:clamp(20px,3vw,38px);font-style:italic;line-height:1.2;margin-bottom:6px;}
/* FIXED: the colour in the next rule was var(--muted), the theme's grey. In the light theme
   that is a dark grey meant for white backgrounds, but a cover page is black in both themes,
   so the line under the title stayed hard to read there. It now always uses #aaa, the light
   grey of the dark theme. In the dark theme this is the same colour as before. */
.p-cover .cover-sub{font-family:var(--sans);font-size:12px;color:#aaa;}

/* SHOWCASE — video hero + side info */
.p-showcase{background:#060606;color:#fff;display:grid;grid-template-columns:1fr 320px;height:100%;overflow:hidden;}
.p-showcase .sh-video{position:relative;overflow:hidden;background:#111;width:100%;height:100%;}
.p-showcase .sh-video video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.p-showcase .sh-ph{width:100%;height:100%;background:repeating-linear-gradient(45deg,#111,#111 12px,#0d0d0d 12px,#0d0d0d 24px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;}
.p-showcase .sh-ph svg{opacity:.35;}
.p-showcase .sh-ph-label{font-family:var(--mono);font-size:9px;color:#777;letter-spacing:1px;}
.p-showcase .sh-ph-file{font-family:var(--mono);font-size:10px;color:rgba(255,26,60,.25);border:1px dashed rgba(255,26,60,.12);padding:4px 10px;}
.p-showcase .sh-info{padding:32px 28px;display:flex;flex-direction:column;gap:16px;border-left:1px solid #1a1a1a;overflow:hidden;}
.p-showcase .sh-kicker{font-family:var(--mono);font-size:8px;letter-spacing:2px;color:var(--red);text-transform:uppercase;}
.p-showcase .sh-title{font-family:var(--serif);font-size:clamp(16px,2vw,26px);font-style:italic;line-height:1.3;}
.p-showcase .sh-rule{width:32px;height:2px;background:var(--red);}
.p-showcase .sh-body{font-family:var(--sans);font-size:12px;color:#aaa;line-height:var(--body-lh);flex:1;}
.p-showcase .sh-meta{display:flex;flex-direction:column;gap:6px;margin-top:auto;padding-top:16px;border-top:1px solid #1a1a1a;}
.p-showcase .sh-meta-row{display:flex;justify-content:space-between;align-items:baseline;}
.p-showcase .sh-meta-label{font-family:var(--mono);font-size:8px;color:#777;text-transform:uppercase;letter-spacing:1px;}
.p-showcase .sh-meta-val{font-family:var(--mono);font-size:10px;color:var(--muted);}

@media(max-width:900px){
  .mag-arrow.prev{left:-8px;}
  .mag-arrow.next{right:-8px;}
  .p-showcase{grid-template-columns:1fr;}
  .p-showcase .sh-info{display:none;}
  .gallery-main{padding:24px;}
  header.gh{padding:0 20px;}
}
@media(max-width:600px){
  .mag-stage{width:96vw;height:72vh;}
}

/* ════════ MOBILE OPTIMISATION (added — small-screen / touch only) ════════ */
@media (max-width: 700px) {
  /* — un-fan the film-strip rack into a vertical scrollable stack —
       (note: the grid element also carries an inline height:520px, so height
        is overridden with !important here) — */
  .gallery-grid {
    display: flex;
    flex-direction: column;
    align-items: center;
    height: auto !important;
    perspective: none;
    padding: 24px 0 48px;
    gap: 32px;
  }
  .gallery-card,
  .gallery-card:hover,
  .gallery-card:nth-child(1), .gallery-card:nth-child(2), .gallery-card:nth-child(3),
  .gallery-card:nth-child(1):hover, .gallery-card:nth-child(2):hover, .gallery-card:nth-child(3):hover {
    position: relative !important;
    transform: none !important;
    filter: drop-shadow(0 18px 34px rgba(0,0,0,.8)) !important;
    width: min(300px, 88vw);
    z-index: auto !important;
  }
  .film-strip { width: 100%; }
}

@media (max-width: 600px) {
  .gallery-main { padding: 20px 16px; }
  .gallery-intro { margin-bottom: 24px; }
  .theme-toggle { width: 40px; height: 40px; }

  /* — SHOWCASE viewer: stack the info panel BELOW the video instead of hiding it —
       (the existing max-width:900px rule sets .sh-info{display:none}; this re-shows
        and stacks it on phones)
       CHANGED: the panel used to be squeezed into whatever space was left under the
       video with its overflow hidden, so most of each description was cut off and
       could not be reached. Now the video keeps its place at the top and the panel
       underneath scrolls on its own. — */
  .p-showcase {
    display: flex;               /* a simple column: video first, then the text */
    flex-direction: column;
    height: 100%;
    overflow: hidden;
  }
  /* the video box: 42% of the screen height on older phones... */
  .p-showcase .sh-video { flex: 0 0 auto; height: 42vh; min-height: 0; background: #000; }
  /* ...and on current phones it takes the shape of the video itself (the page script sets
     --video-shape once the video's size is known), but never more than 46% of the page,
     so the text always keeps its share */
  @supports (aspect-ratio: 1 / 1) {
    .p-showcase .sh-video { height: auto; aspect-ratio: var(--video-shape, 16 / 9); max-height: 46%; }
  }
  .p-showcase .sh-info {
    display: flex !important;
    flex: 1 1 0;                 /* fill the rest of the page... */
    min-height: 0;
    overflow-y: auto;            /* ...and scroll when the text is longer than that */
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    border-left: none;
    border-top: 1px solid #1a1a1a;
    padding: 20px 20px 40px;
    gap: 14px;
    /* fade the last few pixels as a hint that there is more text to scroll to */
    -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 30px), transparent);
            mask-image: linear-gradient(to bottom, #000 calc(100% - 30px), transparent);
  }
  .p-showcase .sh-kicker { font-size: 9px; }
  .p-showcase .sh-body { flex: none; font-size: 13px; }       /* a little larger, easier to read */
  .p-showcase .sh-meta { margin-top: 4px; }
  .p-showcase .sh-meta-label { font-size: 9px; }

  /* — show the FULL video/frame (no crop) in the viewer — */
  .p-showcase .sh-video video,
  .p-cover .cover-video-wrap video { object-fit: contain !important; background: #000; }
  .p-cover .cover-video-wrap { background: #000; }
}

/* ════════ LIGHT / DARK THEME TOGGLE (added) ════════ */
:root{

}

  --overlay-bg:rgba(0,0,0,0.97); --chrome-bg:rgba(7,7,7,0.8); --bar-bg:rgba(7,7,7,0.85); --bar-border:#2a2a2a; --track:#1e1e1e;
}

/* ════════ PHONE LAYOUT v2 (added) ════════
   In plain words, this block does three things on phones (screens up to 600px wide):
   1. Tidies the top bars: an arrow-only back/close button, a one-line title, no counter.
   2. Lays the viewer out as: top bar, the page filling the middle, and a controls
      bar underneath with previous / page count / next.
   3. Moves the arrows into that bar. They used to sit on top of the video and its controls.
   None of it applies to desktop-sized screens. */

/* — the phone controls bar exists only for phones; hidden everywhere else — */
.mag-mbar { display: none; }

/* — while the viewer is open, a sideways swipe means "turn the page". This tells the browser
     not to use sideways touch movements for its own gestures (such as swipe-to-go-back)
     inside the viewer. Scrolling up and down and pinch-zoom still work. It only affects
     touch screens; a mouse is not affected. — */
#mag-overlay { touch-action: pan-y; touch-action: pan-y pinch-zoom; }

@media (max-width: 600px) {
  /* — LIST PAGE HEADER: arrow-only back button, one-line title, no counter —
     "font-size: 0" hides the words "Back to Portfolio" but keeps the arrow;
     the link still carries the full name for screen readers (aria-label in the HTML). */
  header.gh { justify-content: flex-start; gap: 12px; padding: 0 16px 0 66px; }
  .back-link { flex: 0 0 auto; width: 44px; height: 44px; padding: 0; gap: 0; justify-content: center; font-size: 0; letter-spacing: 0; border-radius: 12px; }
  .back-link svg { width: 18px; height: 18px; }
  .gh-title { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gh-counter { display: none; }

  /* — VIEWER TOP BAR: arrow-only close button and a one-line title — */
  .mag-chrome { justify-content: flex-start; gap: 12px; padding: 0 16px 0 66px; }
  .mag-back { flex: 0 0 auto; width: 44px; height: 44px; padding: 0; gap: 0; justify-content: center; font-size: 0; letter-spacing: 0; border-radius: 12px; }
  .mag-back svg { width: 18px; height: 18px; }
  .mag-issue-label { flex: 1 1 auto; min-width: 0; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mag-progress-wrap { display: none; }            /* the page count moves to the bar under the page */

  /* — VIEWER LAYOUT: top bar (56px), the page fills the middle, controls bar (76px) at the bottom — */
  #mag-overlay { justify-content: flex-start; }
  .mag-stage { width: 100vw; height: calc(100% - 132px); margin-top: 56px; }
  .page-front { box-shadow: none; }                /* the page now spans the screen, so its edge shadow is not needed */
  .mag-arrow { display: none; }                    /* the side arrows are replaced by the bar below */
  .page-num-corner { display: none; }              /* the small page number in the corner is repeated in the bar below */

  /* — CONTROLS BAR under the page — */
  .mag-mbar { display: flex; position: absolute; left: 0; right: 0; bottom: 0; height: 76px; padding: 0 16px; align-items: center; justify-content: space-between; z-index: 20; }
  .mag-mbtn { width: 52px; height: 52px; padding: 0; border-radius: 14px; border: 1px solid var(--bar-border); background: var(--bar-bg); display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 6px 18px rgba(0,0,0,.35); -webkit-tap-highlight-color: transparent; }
  .mag-mbtn svg { width: 20px; height: 20px; stroke: var(--red); fill: none; }
  .mag-mbtn:active { background: linear-gradient(135deg, var(--pink), var(--red)); border-color: transparent; }   /* lights up while pressed */
  .mag-mbtn:active svg { stroke: #fff; }
  .mag-mbtn:disabled { opacity: .25; }             /* first / last page */
  .mag-mcount { display: flex; flex-direction: column; align-items: center; gap: 9px; }
  .mag-mcount .mag-page-num { font-size: 12px; letter-spacing: 1px; }
  .mag-mcount .mag-progress { width: 120px; }
}

/* ════════ STAGE 4 (ADDED): VISUAL POLISH ════════
   This block is the whole of Stage 4 for the look of this page. In plain words it does five things:
   1. LARGER TEXT. Running text is at least 16px, supporting text at least 14px, and no label
      is smaller than 12px. (Before, running text was 13 to 15px and some labels were 7px.)
   2. ONE HEADING STYLE. Every heading uses Space Grotesk in bold, the typeface of the body text.
   3. ONE BUTTON STYLE. Rounded corners and soft shadows on every page. There is one look for
      the MAIN button of a screen (filled red, white label) and one for PLAIN buttons (a soft panel).
   4. RED ON THE MAIN ACTION ONLY. Red now marks the one thing a visitor is meant to press on
      each screen. Everything else that used to be red is black, white or grey.
   5. LIGHT THEME FINISHED. Colours that were too faint on a white page are darker there.
   WHY THE BLOCK IS AT THE END OF THE STYLE SHEET: when two rules set the same thing, the browser
   follows the one that comes later. So the rules here replace the older ones above them, and
   the older ones did not have to be rewritten. To undo a part of Stage 4, delete that part of
   this block. The same block, with the same colours, is at the end of all five pages. */

/* — THE COLOURS AND THE TYPEFACE used by the rules below. The first list is for the light theme,
     the second for the dark theme. Changing a colour here changes it everywhere on this page. — */
:root {
  --heading: 'Space Grotesk', sans-serif;          /* the typeface of every heading */
  --action: #c8102e;                               /* red for the WORDS of a main action; deep enough to read on white */
  --action-a: #e6103a;                             /* the fill of a main button runs from this red... */
  --action-b: #c40027;                             /* ...to this one. Both are dark enough for a white label. */
  --action-glow: rgba(200,16,46,.26);              /* the soft glow under a main button */
  --panel: #ffffff;                                /* the fill of a plain button */
  --panel-edge: #d3d3d9;                           /* its outline */
  --panel-shadow: 0 4px 14px rgba(20,20,30,.10);   /* its soft shadow */
  --line: #85858c;                                 /* a stronger outline, for example a plain button under the mouse */
  --quiet: #6a6a71;                                /* grey for small secondary words */
  --ring: #15151a;                                 /* the outline around a button or box reached with the Tab key */
  --text-faint: #6a6a71;                           /* was #74747c, slightly too faint to read on the grey sections */
}
body.dark-theme {
  --action: #ff1a3c;
  --action-glow: rgba(255,26,60,.30);
  --panel: #151517;
  --panel-edge: #303034;
  --panel-shadow: 0 6px 18px rgba(0,0,0,.35);
  --line: #6a6a6a;
  --quiet: #aaaaaa;
  --ring: #ffffff;
  --text-faint: #888888;                           /* unchanged in the dark theme */
}

/* ── 1. LARGER TEXT ── (the old size is given after each new one) */
.gh-title { font-size: 14px; }                                          /* "ANIMATION REELS" in the top bar: was 13px */
.gh-counter { font-size: 13px; }                                        /* "3 reels": was 12px */
.gallery-intro p { max-width: 560px; font-size: 16px; }                 /* the line under the page title: was 14px */
.mag-cover-open { padding-top: 12px; font-size: 12px; }                 /* "OPEN REEL →" under each film strip: was 9px */
.mag-issue-label { font-size: 15px; }                                   /* the reel's name in the viewer's top bar: was 13px */
.mag-page-num { font-size: 13px; }                                      /* "1 / 4": was 11px */
/* the page number in the corner of a page: was 9px, in a dark grey that could not be read over a film.
   It is now light grey on a small dark patch. On the dark text panel the patch cannot be seen; over a film it
   shows as a small tag. Either way the number can be read (at least 5 to 1, even on a white film picture).
   "pointer-events: none" = clicks go straight through it to whatever is underneath (the film's own buttons). */
.page-num-corner { right: 8px; bottom: 7px; padding: 0 7px; border-radius: 7px; background: rgba(10,10,12,.66); color: #e6e6e6; font-size: 12px; line-height: 20px; pointer-events: none; }
/* the lettering on the three film strips (their title typeface is part of the artwork and stays as it was) */
.film-header-brand { font-size: 12px; letter-spacing: 0.5px; line-height: 1.3; }   /* "MARIUS BEJINARIU · MEDIA DEV": was 7px */
.film-header-sub { margin-top: 4px; font-size: 12px; letter-spacing: 0; word-spacing: -3px; }   /* "Reel 01 · Maya": was 7px. The gaps between the words are 3px narrower, so the longest of these lines still fits on one line */
.film-meta-tag { font-size: 12px; letter-spacing: 0; }                  /* the three tool names: was 7px */
/* a reel's first kind of page: a film with words over it */
.p-cover .cover-issue { font-size: 12px; letter-spacing: 2px; }         /* "REEL 01 · 3D ANIMATION": was 9px */
.p-cover .cover-sub { font-size: 15px; }                                /* the line under the title: was 12px */
/* These two small lines lie over a moving film, and a bright part of the picture can pass behind them
   (measured: 3.2 to 1 where a white streak crossed the label). A soft dark edge around the letters keeps them
   readable on any film picture. On a dark picture the edge cannot be seen. */
.p-cover .cover-issue, .p-cover .cover-sub { text-shadow: 0 0 2px #000, 0 0 5px rgba(0,0,0,.9), 0 0 12px rgba(0,0,0,.75); }
/* a reel's second kind of page: a film with a text panel beside it */
.p-showcase .sh-kicker { font-size: 12px; }                             /* "FEATURED WORK": was 8px */
.p-showcase .sh-body { font-size: 16px; line-height: 1.6; }             /* the description: was 12px */
.p-showcase .sh-meta-label { font-size: 12px; color: #999; }            /* "SOFTWARE", "RENDERER"...: was 8px, in a grey too dark to read */
.p-showcase .sh-meta-val { font-size: 13px; color: #aaa; }              /* "Blender", "Cycles"...: was 10px (and too dark in the light theme) */

/* THE TEXT PANEL ON A COMPUTER. At the old 12px a long description already ran past the bottom of
   this panel on laptop-sized screens, and its last lines were cut off. With larger text that would
   happen more often. So, as it already does on phones, the panel now scrolls when the text is longer
   than the panel. It is also 20px wider. "min-width: 901px" = screens where the panel is beside the film. */
@media (min-width: 901px) {
  .p-showcase { grid-template-columns: 1fr 340px; }                     /* was 320px */
  .p-showcase .sh-info { padding: 30px 26px 36px; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: #555 transparent;
    /* the last few pixels fade out: a hint that there is more text to scroll to (the same idea as on phones) */
    -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 32px), transparent);
            mask-image: linear-gradient(to bottom, #000 calc(100% - 32px), transparent); }
  .p-showcase .sh-body { flex: none; }                                  /* the description takes the height of its own text... */
  .p-showcase .sh-meta { margin-top: auto; }                            /* ...and the facts stay at the bottom when there is room to spare */
}

/* ── 2. ONE HEADING STYLE ── */
.gallery-intro h1 { font-family: var(--heading); font-style: normal; font-weight: 700; letter-spacing: -0.04em; line-height: 1.05; text-wrap: balance; }   /* the page title was in Playfair Display italic; "balance" = lines of similar length when it wraps */
.mag-issue-label { font-family: var(--heading); font-style: normal; font-weight: 500; }   /* the reel's name in the viewer's top bar */
.p-cover .cover-title, .p-showcase .sh-title { font-family: var(--heading); font-style: normal; font-weight: 700; letter-spacing: -0.02em; line-height: 1.12; text-wrap: balance; }   /* the titles inside a reel */
.p-cover .cover-title { font-size: clamp(22px, 3vw, 38px); }             /* was 20 to 38px */
.p-showcase .sh-title { font-size: clamp(20px, 2vw, 26px); }             /* was 16 to 26px: on a phone it was no larger than the text under it */

/* ── 3. ONE BUTTON STYLE ──
   PLAIN buttons: "Back to Portfolio" and "Close Reel" used to be filled red, although neither is
   the main action of its screen. They are soft panels now. */
.back-link, .mag-back { color: var(--text); background: var(--panel); border-color: var(--panel-edge); border-radius: 12px; box-shadow: var(--panel-shadow); -webkit-backdrop-filter: none; backdrop-filter: none; }
.back-link:hover, .mag-back:hover { color: var(--text-strong); background: var(--panel); border-color: var(--line); box-shadow: var(--panel-shadow); }
/* their lettering, on screens wider than a phone. (On phones these two buttons show only an arrow:
   the older phone rules hide the words by setting their size to 0, and that must not be undone here.) */
@media (min-width: 601px) {
  .back-link, .mag-back { min-height: 38px; padding: 9px 16px; font-size: 13px; font-weight: 700; letter-spacing: 0.02em; line-height: 1.2; }   /* was 11px */
  /* the viewer's top bar must stay on one line: the button and the page count never break in two,
     and if the window is too narrow for the reel's name, the name is shortened with "…" */
  .back-link, .mag-back, .mag-progress-wrap { flex: 0 0 auto; white-space: nowrap; }
  .mag-issue-label { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
}
/* NARROW WINDOWS AND SMALL TABLETS (601 to 760px wide). The larger lettering needs more room than the
   viewer's top bar has at this width: "Close Reel", the reel's name and "1 / 4" each broke onto
   two lines. So here the same three things are a little more compact. Nothing is left out. */
@media (min-width: 601px) and (max-width: 760px) {
  .mag-chrome { gap: 12px; padding-right: 20px; }                       /* the bar's right-hand margin: was 32px */
  .mag-back { padding: 9px 12px; font-size: 12px; }                     /* 1px smaller than on wider screens, still larger than the old 11px */
  .mag-issue-label { font-size: 13px; }                                 /* the old size */
  .mag-progress-wrap { gap: 10px; }
  .mag-progress { width: 56px; }                                        /* the thin "how far through" line: was 100px wide */
}
/* a button reached with the Tab key gets a clear outline, in black or white */
.back-link:focus-visible, .mag-back:focus-visible, .mag-arrow:focus-visible, .mag-mbtn:focus-visible { outline: 2px solid var(--ring); outline-offset: 3px; }

/* NOTE (9 October 2026): PART 4 BELOW IS REVERSED FURTHER DOWN. The block "RED ACCENTS RESTORED" at the end of
   this style sheet puts the red back on the things listed in part 4, and on the headings and buttons that
   parts 2 and 3 had turned black, white or grey. The rules of part 4 are still here, but wherever that later
   block names the same thing it has the last word. The other parts of Stage 4 (larger text, the heading
   typeface, the shape of the buttons, the light theme) are not affected. */
/* ── 4. RED ON THE MAIN ACTION ONLY ──
   What stays red on this page: "OPEN REEL →" under each film strip, the main action of the list.
   The films themselves are untouched. Everything below used to be red or pink and is now black,
   white or grey. */
.gh-title { color: var(--text-strong); }                                 /* "ANIMATION REELS" in the top bar */
.theme-toggle:hover { border-color: var(--line); color: var(--text-strong); box-shadow: 0 4px 14px rgba(0,0,0,.3); }
.mag-cover-open, .gallery-card:hover .mag-cover-open { color: var(--action); }   /* STAYS RED, and is now full strength instead of half see-through */
.gallery-card:hover .mag-cover-open { text-decoration: underline; text-underline-offset: 4px; }
.film-header { border-bottom-color: #fff; }                              /* the two lines across each film strip */
.film-meta { border-top-color: #fff; }
.film-header-sub { color: #bbb; }                                        /* "Reel 01 · Maya" */
.film-thumb-cell::after { background: none; }
.mag-progress-fill { background: var(--text-strong); }                   /* the thin "how far through" line */
/* the two page arrows: a white or black arrow; the button turns to that colour under the mouse */
.mag-arrow svg { stroke: var(--text-strong); }
.mag-arrow:hover { border-color: transparent; background: var(--text-strong); box-shadow: 0 10px 26px rgba(0,0,0,.35); }
.mag-arrow:hover svg { stroke: var(--bg); }
/* inside a reel (these pages are dark in both themes) */
.p-cover .cover-issue { color: #d0d0d0; }                                /* "REEL 01 · 3D ANIMATION" */
.p-showcase .sh-kicker { color: #bbb; }                                  /* "FEATURED WORK" */
.p-showcase .sh-rule { background: #fff; }                               /* the short line under a title */
/* the stand-ins behind each film (a play ring, a small drawing and a file name). They are only seen where a
     film is missing or a phone has not drawn its first picture: the same faint look as before, in grey instead of red */
.film-play-btn { border-color: rgba(255,255,255,.3); }
.film-play-btn::after { border-color: transparent transparent transparent rgba(255,255,255,.4); }
.film-frame:hover .film-play-btn { border-color: rgba(255,255,255,.6); background: rgba(255,255,255,.06); }
.p-cover .cover-ph svg *, .p-showcase .sh-ph svg * { stroke: rgba(255,255,255,.4); }
.p-cover .cover-ph-file { border-color: rgba(255,255,255,.12); color: rgba(255,255,255,.25); }
.p-showcase .sh-ph-file { border-color: rgba(255,255,255,.1); color: rgba(255,255,255,.22); }

/* ── 5. LIGHT THEME ──
   The shadows under the three film strips were made for a black page. On a white page they were
   a heavy black cloud that hid the "OPEN REEL" labels. In the light theme they are lighter and
   stay close to the film strips, so that each label stands on a clean white background. */
body:not(.dark-theme) .gallery-card:nth-child(1) { filter: drop-shadow(-4px 5px 8px rgba(20,20,30,.20)); }
body:not(.dark-theme) .gallery-card:nth-child(1):hover { filter: drop-shadow(-5px 7px 11px rgba(20,20,30,.22)); }
body:not(.dark-theme) .gallery-card:nth-child(2) { filter: drop-shadow(0 5px 9px rgba(20,20,30,.22)); }
body:not(.dark-theme) .gallery-card:nth-child(2):hover { filter: drop-shadow(0 8px 12px rgba(20,20,30,.24)); }
body:not(.dark-theme) .gallery-card:nth-child(3) { filter: drop-shadow(4px 5px 8px rgba(20,20,30,.20)); }
body:not(.dark-theme) .gallery-card:nth-child(3):hover { filter: drop-shadow(5px 7px 11px rgba(20,20,30,.22)); }
/* The OPENED reel had the same kind of shadow: a black glow all round the page, made for the black
   backdrop of the dark theme. On the pale backdrop of the light theme it is now a soft grey shadow under
   the page. "min-width: 601px" = screens wider than a phone (on a phone the page fills the screen and
   has no shadow at all). */
@media (min-width: 601px) {
  body:not(.dark-theme) .page-front { box-shadow: 0 8px 24px rgba(20,20,30,.20); }
}

/* ── DARK THEME: THE TWO OUTER FILM STRIPS ──
   The middle film strip throws its shadow over the inner half of its two neighbours. That shadow
   also dims their "OPEN REEL" labels: measured on the finished picture they came to 4.4 to 1, just
   under the 4.5 that small text needs. Their red is a little lighter to make up for it, so under
   the shadow all three labels look alike and read at least 4.5 to 1.
   "min-width: 701px" = the fanned-out layout; on phones the strips are stacked and nothing overlaps. */
@media (min-width: 701px) {
  body.dark-theme .gallery-card:nth-child(1) .mag-cover-open,
  body.dark-theme .gallery-card:nth-child(3) .mag-cover-open { color: #ff5572; }
}

/* ── PHONES ──
   The older phone rules sit higher up in this style sheet, so the new rules above would win over
   them. Where a phone needs its own value, it is given again here. */
@media (max-width: 700px) {
  /* the stacked film strips: one lighter shadow in the light theme ("!important" because the older rule it replaces uses it) */
  body:not(.dark-theme) .gallery-card,
  body:not(.dark-theme) .gallery-card:hover,
  body:not(.dark-theme) .gallery-card:nth-child(1), body:not(.dark-theme) .gallery-card:nth-child(2), body:not(.dark-theme) .gallery-card:nth-child(3),
  body:not(.dark-theme) .gallery-card:nth-child(1):hover, body:not(.dark-theme) .gallery-card:nth-child(2):hover, body:not(.dark-theme) .gallery-card:nth-child(3):hover {
    filter: drop-shadow(0 5px 9px rgba(20,20,30,.22)) !important;
  }
}
@media (max-width: 600px) {
  .mag-mcount .mag-page-num { font-size: 13px; }                         /* "1 / 4" in the bar under the page: was 12px */
  .p-showcase .sh-kicker, .p-showcase .sh-meta-label { font-size: 12px; }   /* was 9px on phones */
  .p-showcase .sh-body { font-size: 16px; }                              /* was 13px on phones */
  /* the two arrow buttons in the bar under the page: a white or black arrow; the button lights up in that colour while pressed */
  .mag-mbtn svg { stroke: var(--text-strong); }
  .mag-mbtn:active { border-color: transparent; background: var(--text-strong); }
  .mag-mbtn:active svg { stroke: var(--bg); }
}
/* ════════ END OF STAGE 4 ════════ */

/* ════════ STAGE 5 (ADDED): ACCESSIBILITY ════════
   This block is the style-sheet part of Stage 5 for this page. In plain words:
   • KEYBOARD. Whatever can be pressed gets a clear outline when it is reached with the Tab key.
     The outline is near-black in the light theme and white in the dark theme, so it always
     stands out. A mouse click or a tap does not show it.
   • REDUCE MOTION. Phones and computers have a setting called "Reduce motion" (people who get
     dizzy or distracted by moving pictures switch it on). Every rule inside
     "@media (prefers-reduced-motion: reduce) { ... }" applies only to those visitors.
     Everybody else sees the page exactly as before.
   Like the Stage 4 block, this one sits at the end of the style sheet so that its rules win over
   the older ones above them. To undo a part of Stage 5, delete that part of this block. */

/* ── 1. KEYBOARD ──
   ":focus-visible" means: the link, button or film strip the keyboard is on right now.
   var(--ring) is the outline colour from the Stage 4 list above: near-black in the light theme, white in the dark theme. */
a:focus-visible, button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--ring); outline-offset: 3px; }
/* THE VIEWER ITSELF. After a click or a tap on a film strip, the page script puts the keyboard on the viewer as a whole
   and not on one of its buttons (search for "IN AND OUT OF THE VIEWER" there). The viewer fills the screen, so an
   outline around it would only be a stray line along the edges. This rule makes sure none is drawn. */
#mag-overlay:focus { outline: none; }

/* THE THREE FILM STRIPS. The page script makes each strip a stop for the Tab key (search for "KEYBOARD: THE FILM STRIPS" there).
   The outline is drawn around the strip, 4px away from it. The gap between the two is filled with the colour of the page
   (the "box-shadow" line), so the outline can be told apart even where it crosses a neighbouring strip. */
.gallery-card:focus-visible { outline: none; }
.gallery-card:focus-visible .film-strip { outline: 2px solid var(--ring); outline-offset: 4px; box-shadow: 0 0 0 4px var(--bg); }
/* when the list has to scroll to show the strip the keyboard has moved to (a small window), the strip stops clear
   of the top bar, which stays in place over the top 60px of the list */
.gallery-card:focus-visible { scroll-margin-top: 76px; scroll-margin-bottom: 16px; }
.gallery-card:focus-visible .mag-cover-open { text-decoration: underline; text-underline-offset: 4px; }   /* "OPEN REEL" is underlined, as it is under the mouse */
/* the spoken name of a film strip: one sentence that only a screen reader gets (the page script writes it into each strip:
   search for "spoken name" there). These lines shrink it to a single point and cut off everything outside that point,
   so it takes no room and cannot be seen. It must not be "display: none": a screen reader skips text that is switched off. */
.spoken-name { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
/* the strip the keyboard is on also comes forward, exactly as a strip does under the mouse (the same three positions as
   the ":hover" rules near the top of this style sheet). "min-width: 701px" = the fanned-out layout; phones stack the strips. */
@media (min-width: 701px) {
  .gallery-card:nth-child(1):focus-visible { transform: translateX(-180px) translateY(8px) rotateY(18deg) rotateZ(-4deg) scale(0.93); z-index: 4; }
  .gallery-card:nth-child(2):focus-visible { transform: translateX(0px) translateY(-20px) scale(1.06); z-index: 4; }
  .gallery-card:nth-child(3):focus-visible { transform: translateX(180px) translateY(8px) rotateY(-18deg) rotateZ(4deg) scale(0.93); z-index: 4; }
}

/* the two page arrows of the viewer. On tablets and small windows they lie over the edges of the page, where a white
   outline could vanish against a white part of a film. A 3px band in the colour of the theme is put between the
   button and its outline (the first part of "box-shadow"; the second part is the button's usual shadow), so the
   outline always has a contrasting edge. */
.mag-arrow:focus-visible { box-shadow: 0 0 0 3px var(--bg), 0 6px 18px rgba(0,0,0,.35); }

/* INSIDE A REEL the pages are dark in both themes, so the outline there is always white. It is drawn just inside the
   film or the text panel ("outline-offset: -4px"), because anything outside them would be cut off at the edge of the page. */
.p-showcase .sh-video video:focus-visible, .p-showcase .sh-info:focus-visible { outline: 2px solid #fff; outline-offset: -4px; }
/* the text panel fades out at its bottom edge, as a hint that there is more to scroll to. While the keyboard is on the
   panel that fade is switched off, otherwise it would also fade the bottom of the outline. */
.p-showcase .sh-info:focus-visible { -webkit-mask-image: none; mask-image: none; }
/* A film can be any colour, and a plain white outline would not show on a white film (the engine film has a white
   background). So, in browsers that know ":has" (all current ones), the frame around a film is drawn by an extra box
   on top of the film instead: a white line with a black line on each side of it, which shows on any picture.
   ".sh-video:has(video:focus-visible)" = the box that holds the film, while the keyboard is on the film.
   Older browsers keep the plain white outline from the rule above. */
@supports selector(:has(a)) {
  .p-showcase .sh-video video:focus-visible { outline: none; }
  .p-showcase .sh-video:has(video:focus-visible)::after { content: ''; position: absolute; top: 2px; right: 2px; bottom: 2px; left: 2px; z-index: 2; border: 2px solid #fff; box-shadow: 0 0 0 2px rgba(0,0,0,.85), inset 0 0 0 2px rgba(0,0,0,.85); pointer-events: none; }
}

/* THE CLOSED VIEWER. It used to be only see-through while closed ("opacity: 0"), so its buttons were still there: the
   Tab key walked through buttons nobody could see, and a screen reader read them out. "visibility: hidden" takes the
   closed viewer out of reach completely. The last part of each "transition" line (visibility 0s linear .4s) delays that
   until the fade-out has finished, so opening and closing look exactly as before. */
#mag-overlay { visibility: hidden; transition: opacity .4s, background-color .35s ease, visibility 0s linear .4s; }
#mag-overlay.open { visibility: visible; transition: opacity .4s, background-color .35s ease, visibility 0s; }

/* ── 2. THE STAND-INS BEHIND THE FILMS ──
   Behind every film lies a stand-in (a play ring or a small drawing, the word "Load" and the file name) for the case
   that a film is missing. The films on the three strips are 15% see-through and the large films on a reel's title
   pages 30%, so those words showed faintly through the picture. The page script now adds "has-film" as soon as a
   film has a picture to show, and these two rules then hide the words behind it. A film that is missing, or has
   not loaded yet, never gets "has-film", so its stand-in shows as before. */
.film-frame.has-film .film-frame-ph > *,
.p-cover .cover-video-wrap.has-film .cover-ph > * { visibility: hidden; }

/* ── 3. REDUCE MOTION ──
   Only for visitors whose phone or computer asks for less motion (see the note at the top of this block).
   The page script has its own part for the same visitors: search for "calmMotion" there. */
/* the "Play film" button on a reel's title pages. For these visitors the film there does not start by itself; it waits
   for this button. Everybody else never sees the button ("display: none"), because for them the film plays by itself. */
.cover-play { display: none; }
@media (prefers-reduced-motion: reduce) {
  .cover-play { position: absolute; top: 14px; left: 14px; z-index: 4; display: inline-flex; align-items: center; gap: 9px; min-height: 40px; padding: 9px 15px; border: 1px solid rgba(255,255,255,.45); border-radius: 12px; background: rgba(10,10,12,.78); color: #fff; font-family: var(--mono); font-size: 13px; font-weight: 700; letter-spacing: 0.02em; line-height: 1.2; cursor: pointer; }
  .cover-play:hover { border-color: #fff; background: rgba(10,10,12,.92); }
  .cover-play svg { width: 12px; height: 12px; fill: currentColor; }
  /* its outline is white in both themes, on a dark band 7px wide around the button (the "box-shadow"), so that it shows on any film */
  .cover-play:focus-visible { outline: 2px solid #fff; outline-offset: 3px; box-shadow: 0 0 0 7px rgba(10,10,12,.78); }
  /* A film that waits for the button may have no picture yet: an iPhone does not fetch a film until play is pressed.
     The stand-in behind it (a small drawing, the word "Load" and the file name) would then look like a missing film.
     So on a title page that has the button ("waits-for-play", set by the page script) the stand-in is hidden. A film
     that really is missing loses the button and the mark, and its stand-in shows as before. */
  .p-cover .cover-video-wrap.waits-for-play .cover-ph > * { visibility: hidden; }
  /* a film strip under the mouse (or reached with the Tab key) stays where it is: it still comes to the front, but it does
     not slide up or grow. The three lines repeat the resting position of each strip. Phones are not affected: their strips never move. */
  .gallery-card:nth-child(1):hover, .gallery-card:nth-child(1):focus-visible { transform: translateX(-180px) translateY(32px) rotateY(18deg) rotateZ(-4deg) scale(0.88); }
  .gallery-card:nth-child(2):hover, .gallery-card:nth-child(2):focus-visible { transform: translateX(0px) translateY(0px) scale(1.0); }
  .gallery-card:nth-child(3):hover, .gallery-card:nth-child(3):focus-visible { transform: translateX(180px) translateY(32px) rotateY(-18deg) rotateZ(4deg) scale(0.88); }
  .gallery-card:hover .film-frame video, .gallery-card:hover .film-frame img { transform: none; }   /* the picture on the strip does not zoom either */
  .page { transition: none; }                                             /* no page-turn: the next page simply appears (the page script does the same) */
  /* buttons no longer grow or nudge under the mouse */
  .mag-arrow:hover { transform: translateY(-50%); }
  .mag-arrow.prev:hover svg, .mag-arrow.next:hover svg, .back-link:hover svg, .mag-back:hover svg { transform: none; }
  .theme-toggle:hover { transform: none; }
}

/* ── 4. TABLETS, SMALL WINDOWS AND PHONES HELD SIDEWAYS (601 to 900px wide): THE TEXT IS SHOWN ──
   At these widths the text panel of a film (its title, description and facts) was simply left out. It is shown now.
   WIDER THAN TALL (a phone held sideways, a small window): the film on the left and the text beside it, as on a
   computer but with a narrower panel. The panel keeps 48px free on its right, where the "next page" arrow sits. */
@media (min-width: 601px) and (max-width: 900px) and (orientation: landscape) {
  .p-showcase { grid-template-columns: 1fr 300px; }
  .p-showcase .sh-info { display: flex; gap: 12px; padding: 22px 48px 30px 20px; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: #555 transparent;
    /* the last few pixels fade out: a hint that there is more text to scroll to (the same idea as on computers and phones) */
    -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 30px), transparent);
            mask-image: linear-gradient(to bottom, #000 calc(100% - 30px), transparent); }
  .p-showcase .sh-body { flex: none; }                                    /* the description takes the height of its own text... */
  .p-showcase .sh-meta { margin-top: auto; }                              /* ...and the facts stay at the bottom when there is room to spare */
}
/* TALLER THAN WIDE (a tablet held upright): the film on top, shown whole, and the text underneath, where it scrolls
   by itself. This is the layout phones already have. 48px stay free on both sides of the text, where the two page arrows sit. */
@media (min-width: 601px) and (max-width: 900px) and (orientation: portrait) {
  .p-showcase { display: flex; flex-direction: column; height: 100%; overflow: hidden; }
  /* the film's box is never more than 56% of the page, so the text always keeps its share... */
  .p-showcase .sh-video { flex: 0 0 auto; height: 42vh; max-height: 56%; min-height: 0; background: #000; }
  /* ...and in current browsers it takes the shape of the film itself (the page script sets --video-shape once it knows the film's size) */
  @supports (aspect-ratio: 1 / 1) {
    .p-showcase .sh-video { height: auto; aspect-ratio: var(--video-shape, 16 / 9); }
  }
  .p-showcase .sh-video video { object-fit: contain; background: #000; }  /* the whole film, not cut off */
  .p-showcase .sh-info { display: flex; flex: 1 1 0; min-height: 0; gap: 14px; padding: 24px 48px 40px; border-left: none; border-top: 1px solid #1a1a1a; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
    -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 30px), transparent);
            mask-image: linear-gradient(to bottom, #000 calc(100% - 30px), transparent); }
  .p-showcase .sh-body { flex: none; }
  .p-showcase .sh-meta { margin-top: 4px; }
  /* The two page arrows sit half-way down the page. In this layout that is where the film's own row of buttons
     (play, time line, sound) now is, and the arrows covered its two ends. Here they sit lower, at 72% of the
     height of the page: beside the text, in the 48px kept free for them, and clear of the title on a title page. */
  .mag-arrow { top: 72%; }
}
/* SHORT SCREENS (up to 688px high: a phone held sideways, a short window). The page of a reel is 82% of the height of
   the screen and sits in the middle of it. On a short screen that left less than the 56px the top bar needs, so the
   top of the page slid underneath the bar. Here the page is pushed down, so that it always starts 6px below the bar.
   • "margin-top" does the pushing. The page is centred together with its margin, so a margin of 124px minus 18% of
     the height of the screen puts its top edge at 62px. At 688px that margin comes to 0, so nothing jumps there.
   • On a very short screen (under 478px high: a phone held sideways) a page of 82% would then run off the bottom.
     There the page is the height of the screen minus 86px: 62px above it for the bar, and 24px below it.
   "min(a, b)" picks the smaller of two values. "dvh" is the height that is really visible while a phone's own bars
   are showing; browsers that do not know it skip the second line and use the first. */
@media (min-width: 601px) and (max-height: 688px) {
  .mag-stage { height: min(82vh, calc(100vh - 86px)); margin-top: min(38px, calc(124px - 18vh)); }
  .mag-stage { height: min(82dvh, calc(100dvh - 86px)); margin-top: min(38px, calc(124px - 18dvh)); }
}
/* ════════ END OF STAGE 5 ════════ */

/* ════════ RED ACCENTS RESTORED (ADDED 9 October 2026) ════════
   Stage 4 took the red off everything except the main action of each screen. This block puts the
   red back where the published site has it. In plain words:
   • WHAT IT DOES. Each rule below gives one thing its red back: a colour for words, a line,
     a fill or a glow. The note after each rule says what the thing is.
   • WHY IT IS AT THE END OF THE STYLE SHEET. When two rules set the same thing, the browser
     follows the one that comes later. This block comes after Stage 4 and Stage 5, so it has the
     last word on these colours, and nothing above it had to be rewritten.
     To undo all of it, delete this block. To undo one thing, delete its line. A few things take
     three lines; the note above them says so. Delete such lines together: with only one of
     them gone, a white sign can be left on a white button.
   • WHAT IT DOES NOT TOUCH. Text sizes, typefaces, the shape of the buttons, the layout, the
     keyboard outlines, the films and everything the page does. Only colours, tints and glows change.
   • WHICH RED IS USED WHERE.
     var(--action)   The red for words that lie on the page itself. In the dark theme it is the red
                     of the published site (#ff1a3c). In the light theme it is a slightly deeper
                     red (#c8102e), because the bright one is hard to read on white.
                     Both values are set in the Stage 4 list of colours; change them there.
     var(--red)      Always the red of the published site (#ff1a3c), in both themes. Used for drawn
                     lines, edges and drawn signs (the page arrows, the sun and the moon: they do
                     not have to be read like words) and on the parts that are dark in both
                     themes: the film strips and the pages inside a reel.
     the red fill    "linear-gradient(135deg, var(--action-a), var(--action-b))" is the fill of the
                     main buttons of the site ("Explore Work" on the home page). Every red button
                     uses the same fill, so that the red buttons look alike and white lettering
                     can be read on them.
     rgba(255,26,60, 0.3) and similar: the red of the published site, see-through. The last
                     number says how solid it is, from 0 (invisible) to 1 (solid). Tints and glows
                     are copied from the published site as they are.
   • NOT CHANGED HERE, ON PURPOSE. "OPEN REEL →" was red already. */

/* ── THE TOP BAR ── */
.gh-title { color: var(--action); }                                      /* "ANIMATION REELS": red again */
/* "Back to Portfolio" and "Close Reel": red buttons again.
   • "background-origin: border-box" lets the fill run under the 1px edge of the button as well,
     so that no hairline of a different red shows along that edge.
   • Under the mouse the button turns into a plain panel, as it turns plain on the published site.
     That needs no rule here: the Stage 4 rule for ".back-link:hover, .mag-back:hover" is more
     specific than this one, so it still applies. */
.back-link, .mag-back { color: #fff; border-color: transparent; background: linear-gradient(135deg, var(--action-a), var(--action-b)); background-origin: border-box; box-shadow: 0 6px 16px rgba(255,26,60,.32); }
.theme-toggle:hover { border-color: var(--red); color: var(--red); box-shadow: 0 6px 18px rgba(255,26,60,.28), 0 0 0 1px rgba(255,26,60,.25); }   /* the sun / moon button under the mouse: red edge, red sign, soft red glow */

/* ── THE THREE FILM STRIPS (dark in both themes, so the bright red is used in both) ── */
.film-header { border-bottom-color: var(--red); }                        /* the two red lines across each film strip */
.film-meta { border-top-color: var(--red); }
.film-header-sub { color: var(--red); }                                  /* "Reel 01 · Maya" */
.film-thumb-cell::after { background: rgba(255,26,60,.03); }             /* a trace of red on the small cells of the strip. The cells have no height at present, so nothing of it shows; it is back because the published site has the same rule */

/* ── THE VIEWER ── */
.mag-progress-fill { background: var(--red); }                           /* the thin "how far through" line */
/* the two page arrows: a red arrow; under the mouse the button fills with red and the arrow turns white.
   (These three lines belong together.) */
.mag-arrow svg { stroke: var(--red); }
.mag-arrow:hover { border-color: transparent; background: linear-gradient(135deg, var(--action-a), var(--action-b)); background-origin: border-box; box-shadow: 0 10px 26px rgba(255,26,60,.4), 0 0 0 1px rgba(255,26,60,.3); }
.mag-arrow:hover svg { stroke: #fff; }

/* ── INSIDE A REEL (these pages are dark in both themes, so the bright red is used in both) ── */
.p-cover .cover-issue { color: var(--red); }                             /* "REEL 01 · 3D ANIMATION" over the film. It keeps the soft dark edge Stage 4 gave it, so that it reads on a bright film too */
.p-showcase .sh-kicker { color: var(--red); }                            /* "FEATURED WORK" and "PROCESS" */
.p-showcase .sh-rule { background: var(--red); }                         /* the short line under a title */

/* ── THE STAND-INS behind each film (a play ring, a small drawing and a file name). They are only seen
   where a film is missing or a phone has not drawn its first picture: faint red again ── */
.film-play-btn { border-color: rgba(255,26,60,.4); }
.film-play-btn::after { border-color: transparent transparent transparent rgba(255,26,60,.6); }   /* the small triangle in the ring: only its left edge has a colour, which is what makes it a triangle */
.film-frame:hover .film-play-btn { border-color: var(--red); background: rgba(255,26,60,.08); }
.p-cover .cover-ph svg rect, .p-showcase .sh-ph svg rect { stroke: rgba(255,26,60,.5); }
.p-cover .cover-ph svg path, .p-showcase .sh-ph svg path { stroke: rgba(255,26,60,.4); }
.p-cover .cover-ph-file { border-color: rgba(255,26,60,.15); color: rgba(255,26,60,.3); }
.p-showcase .sh-ph-file { border-color: rgba(255,26,60,.12); color: rgba(255,26,60,.25); }

/* ── PHONES (screens up to 600px wide): the two arrow buttons in the bar under the page ──
   A red arrow; while a button is pressed it fills with red and its arrow turns white.
   (The three lines inside the braces belong together.) */
@media (max-width: 600px) {
  .mag-mbtn svg { stroke: var(--red); }
  .mag-mbtn:active { border-color: transparent; background: linear-gradient(135deg, var(--action-a), var(--action-b)); background-origin: border-box; }
  .mag-mbtn:active svg { stroke: #fff; }
}
/* ── KEPT FROM STAGE 5 ──
   A page arrow reached with the Tab key has a band in the colour of the theme between the button and its
   keyboard outline, so that the outline shows on any film. The red glow above (".mag-arrow:hover") would
   take the place of that band whenever the arrow is under the mouse at the same moment. This line repeats
   the Stage 5 rule after it, so that the band keeps the last word. */
.mag-arrow:focus-visible { box-shadow: 0 0 0 3px var(--bg), 0 6px 18px rgba(0,0,0,.35); }
/* ════════ END OF RED ACCENTS RESTORED ════════ */
</style>

<script>
/*
 * ANIMATION REEL DATA
 * ─────────────────────────────────────────────────────────────────
 * Add reels by pushing new objects to the `reels` array.
 * Page types: cover | showcase
 *

/* STAGE 5 (ADDED): asAttr() makes a description safe to put inside aria-label="..." in the HTML that
   the code below writes. A description may contain the characters & " or <, which have a meaning of
   their own in HTML; this swaps each of them for its harmless code. */
const asAttr = text => String(text).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');

const grid = document.getElementById('galleryGrid');
document.getElementById('galleryCounter').textContent = reels.length + ' reels';

/* Sprocket holes helper */
function sprocketRow(count) {
  return Array(count).fill('<div class="sprocket-hole"></div>').join('');
}

/* STAGE 1 (ADDED): on a phone, a tap must not start a preview video.
   Why this is needed: a touch screen has no "hover". But straight after every tap the
   browser also sends the page the mouse events for that tap, and one of them is
   "mouseenter", the same event a mouse sends when it moves over a card. Further down,
   "mouseenter" on a card starts its preview. So on a phone a tap would start the preview
   playing behind the reel viewer, where nobody can see it, and it would keep downloading.
   How it works: the three listeners below keep one note up to date, "was the last thing
   to touch this page a finger?". fingerOnPhone() then answers yes when that note is true
   AND the screen is up to 700px wide (the stacked phone layout of the cards).
   A real mouse sets the note back to "no" as soon as it moves, so hovering over a card
   with a mouse works as it always did, even in a narrow window. */
const phoneList = window.matchMedia('(max-width: 700px)');   // true while the cards are in the stacked phone layout
let fingerWasLast = false;                                    // the note: true after a finger touch, false after a mouse move
document.addEventListener('touchstart', () => { fingerWasLast = true; }, { passive: true, capture: true });       // a finger went down
document.addEventListener('pointerdown', e => { fingerWasLast = (e.pointerType === 'touch'); }, true);            // a press: finger, mouse or pen
document.addEventListener('pointermove', e => { if (e.pointerType === 'mouse') fingerWasLast = false; }, true);   // a real mouse moved
function fingerOnPhone() {
  return phoneList.matches && fingerWasLast;
}

/* ══════════════════════════════════════════
   STAGE 5 (ADDED): REDUCE MOTION
   Phones and computers have a setting called "Reduce motion". People who get dizzy or
   distracted by moving pictures switch it on. (iPhone: Settings > Accessibility > Motion.
   Windows: Settings > Accessibility > Visual effects > Animation effects. Mac: System
   Settings > Accessibility > Display.) The browser passes the choice on to the page.
   calmMotion.matches is true for a visitor who asked for less motion, and false for
   everybody else, for whom nothing changes. Further down it is asked in four places: the
   preview on a film strip, the page-turn, the films on a reel's title pages, and the
   "Play film" button. The style sheet has a part for the same visitors: search for
   "prefers-reduced-motion" there.
══════════════════════════════════════════ */
const calmMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

reels.forEach((reel, ri) => {
  const card = document.createElement('div');
  card.className = 'gallery-card';

  /* STAGE 5 (CHANGED): aria-hidden="true" was added to the <video> line below. The little film on a strip
     is a preview without a description of its own; the strip as a whole is announced as a button
     (see "KEYBOARD: THE FILM STRIPS" after this loop), and a screen reader passes over the preview. */
  card.innerHTML = `
    <div class="film-strip">

      <!-- TOP SPROCKET ROW -->
      <div class="sprocket-row">${sprocketRow(9)}</div>

      <!-- HEADER LABEL -->
      <div class="film-header">

      <div class="sprocket-row">${sprocketRow(9)}</div>

      <!-- MINI THUMB STRIP -->
      <div class="film-thumbs">
        <div class="film-thumb-cell"></div>
        <div class="film-thumb-cell"></div>
        <div class="film-thumb-cell"></div>
        <div class="film-thumb-cell"></div>
      </div>

      <!-- METADATA -->
      <div class="film-meta">
        <div class="film-meta-tags">
          ${reel.tags.map(t=>`<span class="film-meta-tag">${t}</span>`).join('')}
        </div>
        <div class="film-meta-num">0${ri+1}</div>
      </div>

      <!-- BOTTOM SPROCKET ROW -->
      <div class="sprocket-row">${sprocketRow(9)}</div>

    </div>
    <div class="mag-cover-open">OPEN REEL →</div>`;

  /* hover video preview */
  const vid = card.querySelector('video');
  if (vid) {
    /* STAGE 1 (CHANGED): the next line now starts with "if (fingerOnPhone()) return;".
       A tap on a phone leaves the preview alone (see fingerOnPhone above); the tap still
       opens the reel through the "click" line below. Hovering with a mouse is unchanged. */
    /* STAGE 5 (CHANGED): "|| calmMotion.matches" was added to the next line. For a visitor whose device asks
       for less motion the preview does not start under the mouse; the strip shows the film's first picture. */
    card.addEventListener('mouseenter', () => { if (fingerOnPhone() || calmMotion.matches) return; vid.play().catch(()=>{}); });
    card.addEventListener('mouseleave', () => { vid.pause(); vid.currentTime = 0; });
  }

  card.addEventListener('click', () => openReel(ri));
  grid.appendChild(card);
});

/* ══════════════════════════════════════════
   STAGE 5 (ADDED): KEYBOARD: THE FILM STRIPS
   A film strip opens its reel with a click. A strip is a plain box, and the Tab key only
   stops at links and buttons, so a visitor who uses the keyboard could not open a reel
   at all. This block tells the browser that each strip is a button:
   • tabindex="0"      the Tab key stops on the strip;
   • role="button"     a screen reader announces it as a button;
   • a spoken name     ...called, for example, "Open reel: 3D Animation, Reel 01, 4 pages";
   • aria-haspopup     ...and the note that it opens a window on top of the page.
   Enter and Space then do the same as a click. Clicking, tapping and the preview that
   plays under the mouse are not touched.
   (The outline around the strip the keyboard is on is in the style sheet: search for
   "THE THREE FILM STRIPS" there.)

   About the spoken name. A button is announced by the words written on it. A film strip
   carries lettering that is artwork, not a name ("MARIUS BEJINARIU · MEDIA DEV", the tags,
   the number), and read out one after the other it makes no sense. So the two parts of a
   strip that can be seen (the strip itself, and the words "OPEN REEL →" under it) are
   marked aria-hidden="true", which means "for the eye only", and one sentence is added for
   the ear only: a piece of text with the class "spoken-name", which the style sheet shrinks
   to a single point so that it takes no room on screen (search for "spoken-name" there).
   That sentence starts with the same words as the visible label, "Open reel", which is
   what a visitor who gives spoken commands would say.
   The block also does one small thing for the eye: it notes when the little film on a
   strip has a picture to show, so that the style sheet can hide the stand-in behind it
   (search for "THE STAND-INS BEHIND THE FILMS" there).
══════════════════════════════════════════ */
Array.from(grid.children).forEach((card, ri) => {
  const reel  = reels[ri];
  const pages = reel.pages.length;
  card.setAttribute('tabindex', '0');
  card.setAttribute('role', 'button');
  card.setAttribute('aria-haspopup', 'dialog');
  Array.from(card.children).forEach(part => part.setAttribute('aria-hidden', 'true'));   // what can be seen: for the eye only
  const spokenName = document.createElement('span');                                     // what is announced: for the ear only
  spokenName.className = 'spoken-name';
  spokenName.textContent = 'Open reel: ' + reel.title + ', ' + reel.issue + ', ' + pages + (pages === 1 ? ' page' : ' pages');
  card.appendChild(spokenName);
  card.addEventListener('keydown', e => {
    if (e.target !== card) return;
    if (e.key !== 'Enter' && e.key !== ' ' && e.key !== 'Spacebar') return;   // 'Spacebar' is what some older browsers call the Space key
    e.preventDefault();                                         // otherwise Space would also scroll the page
    if (!e.repeat) card.click();                                // do what a click does (once, even if the key is held down)
  });
  /* MOUSE AND TOUCH STAY AS THEY WERE. A strip that is a stop for the Tab key would also take the keyboard whenever
     it is pressed with the mouse or a finger, and the next key would then act on it: after a right-click on a strip,
     for example, Space would open the reel instead of scrolling the page. So right after such a press the keyboard
     is taken off the strip again ("blur" = let go). Only the Tab key leaves the keyboard on a strip.
     (The browser hands the keyboard over just after it has reported the press, which is why the step waits for
     the shortest possible moment first: setTimeout with 0.) */
  card.addEventListener('mousedown', () => setTimeout(() => { if (document.activeElement === card) card.blur(); }, 0));

  /* the stand-in behind the little film: mark the frame "has-film" once the film has a picture */
  const frame   = card.querySelector('.film-frame');
  const preview = frame ? frame.querySelector('video') : null;
  if (preview) {
    const previewHasPicture = () => frame.classList.add('has-film');
    if (preview.readyState >= 2) previewHasPicture();           // 2 = the browser has at least the first picture of the film
    else preview.addEventListener('loadeddata', previewHasPicture, { once: true });   // "loadeddata" = it has just arrived
  }
});
