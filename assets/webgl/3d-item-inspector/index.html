<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0d">
  <title>3D Gallery Item Inspector</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Space+Mono:wght@400;700&display=swap">
  <style>
    :root {
      --bg: #0b0b0d;
      --text: #f4f1ee;
      --muted: #a29d99;
      --red: #ff1a3c;
      --salmon: #ff8a7a;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      overflow: hidden;
      overscroll-behavior: none;
    }

    body {
      color: var(--text);
      font-family: "Space Mono", ui-monospace, Menlo, Consolas, monospace;
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
    }

    #stage {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      top: env(safe-area-inset-top, 0px);
      right: env(safe-area-inset-right, 0px);
      bottom: env(safe-area-inset-bottom, 0px);
      left: env(safe-area-inset-left, 0px);
    }

    #unity-canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: var(--bg);
      outline: none;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    #loader {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
      background:
        radial-gradient(120% 80% at 50% 115%, rgba(255, 26, 60, 0.18), rgba(255, 26, 60, 0) 60%),
        var(--bg);
      transition: opacity 0.45s ease, visibility 0.45s ease;
    }

    #loader.finished {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .card {
      width: 100%;
      max-width: 360px;
      text-align: center;
    }

    .kicker {
      margin: 0 0 10px;
      font-size: 11px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--salmon);
    }

    .title {
      margin: 0 0 24px;
      font-family: "Playfair Display", Georgia, "Times New Roman", serif;
      font-weight: 600;
      font-size: clamp(24px, 6vw, 34px);
      line-height: 1.15;
      color: var(--text);
    }

    .bar {
      position: relative;
      height: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.09);
      overflow: hidden;
    }

    .bar-fill {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--salmon), var(--red));
      box-shadow: 0 0 14px rgba(255, 26, 60, 0.55);
      transition: width 0.25s ease;
    }

    .status {
      display: flex;
      justify-content: space-between;
      margin: 12px 0 0;
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .hint {
      margin: 28px 0 0;
      font-size: 11px;
      line-height: 1.7;
      color: var(--muted);
    }

    .error .kicker { color: var(--red); }

    .error-details {
      margin: 0 0 22px;
      font-size: 12px;
      line-height: 1.6;
      color: var(--muted);
      word-break: break-word;
    }

    .button {
      display: inline-block;
      padding: 12px 22px;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--salmon), var(--red));
      box-shadow: 0 10px 24px -10px rgba(255, 26, 60, 0.7);
      color: #fff;
      font: 700 12px/1 "Space Mono", ui-monospace, Menlo, Consolas, monospace;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .turn-tip {
      position: fixed;
      top: 12px;
      top: calc(12px + env(safe-area-inset-top, 0px));
      right: 16px;
      left: 16px;
      z-index: 3;
      display: flex;
      align-items: center;
      gap: 10px;
      box-sizing: border-box;
      width: -webkit-fit-content;
      width: fit-content;
      margin: 0 auto;
      padding: 6px 6px 6px 14px;
      border: 1px solid rgba(255, 138, 122, 0.35);
      border-radius: 999px;
      background: rgba(11, 11, 13, 0.85);
      box-shadow: 0 10px 24px -12px rgba(0, 0, 0, 0.7);
      color: var(--text);
      font-size: 12px;
      line-height: 1.4;
      transition: opacity 0.35s ease;
    }

    .turn-tip.fading { opacity: 0; }

    .turn-tip svg {
      flex: none;
      width: 18px;
      height: 18px;
      color: var(--salmon);
    }

    .turn-tip button {
      flex: none;
      width: 30px;
      height: 30px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      font: 700 16px/30px "Space Mono", ui-monospace, Menlo, Consolas, monospace;
      cursor: pointer;
    }

    [hidden] { display: none !important; }

    @media (prefers-reduced-motion: reduce) {
      #loader, .bar-fill, .turn-tip { transition: none; }
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
  </div>

  <div id="loader" role="status" aria-live="polite">
    <div class="card" id="loading-card">
      <p class="kicker" id="label"></p>
      <h1 class="title" id="title"></h1>
      <div class="bar" aria-hidden="true"><div class="bar-fill" id="bar-fill"></div></div>
      <p class="status"><span id="state">Loading</span><span id="percent">0%</span></p>
      <p class="hint" id="hint"></p>
    </div>

    <div class="card error" id="error-card" hidden>
      <p class="kicker">Something went wrong</p>
      <h1 class="title">The 3D viewer couldn't start</h1>
      <p class="error-details" id="error-details"></p>
      <button class="button" type="button" id="reload">Try again</button>
    </div>
  </div>

  <div class="turn-tip" id="turn-tip" role="status" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="10" height="16" rx="2"/><path d="M16 5.5a7 7 0 0 1 4.5 6.5"/><polyline points="22 10 20.5 12.5 18 11"/></svg>
    <span id="turn-tip-text"></span>
    <button type="button" id="turn-tip-close" aria-label="Close this tip">&times;</button>
  </div>

  <script>
    (function () {
      "use strict";

      var texts = {
        label: "" || "Interactive 3D",
        title: "3D Gallery Item Inspector" || "3D Item Inspector",
        mouseHint: "" || "Drag to turn \u00b7 Scroll to zoom \u00b7 Click to inspect",
        touchHint: "" || "Drag to turn \u00b7 Pinch to zoom \u00b7 Tap to inspect",
        turnTip: "" || "Turn sideways for the best view"
      };

      var canvas = document.getElementById("unity-canvas");
      var loader = document.getElementById("loader");
      var barFill = document.getElementById("bar-fill");
      var stateText = document.getElementById("state");
      var percentText = document.getElementById("percent");
      var started = false;
      var isMobile = detectMobile();
      var pixelRatio = isMobile ? Math.min(window.devicePixelRatio || 1, 2) : (window.devicePixelRatio || 1);
      var tip = document.getElementById("turn-tip");
      var tipTimer = 0;
      var tipClosed = readTipClosed();
      var wasUpright = null;

      tellUnityTheDevice(isMobile, pixelRatio);

      document.getElementById("label").textContent = texts.label;
      document.getElementById("title").textContent = texts.title;
      document.getElementById("hint").textContent = isMobile ? texts.touchHint : texts.mouseHint;
      document.getElementById("turn-tip-text").textContent = texts.turnTip;
      document.getElementById("turn-tip-close").addEventListener("click", function () {
        tipClosed = true;
        rememberTipClosed();
        hideTip();
      });

      if (isMobile) {
        document.addEventListener("gesturestart", function (event) { event.preventDefault(); }, { passive: false });
        canvas.addEventListener("contextmenu", function (event) { event.preventDefault(); });
        updateTip();
        window.addEventListener("resize", updateTip);
        window.addEventListener("orientationchange", updateTip);
        if (screen.orientation && screen.orientation.addEventListener) {
          screen.orientation.addEventListener("change", updateTip);
        }
      }

      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/1c5d14994295dd3c3f2785d2f71404ca.data.unityweb",
        frameworkUrl: buildUrl + "/8ac9043517888b7c04a88b37ea20786e.framework.js.unityweb",
        codeUrl: buildUrl + "/2e7c1a2b852bc37600559a096037ee91.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Blurred_line",
        productVersion: "0.1.0",
        showBanner: showMessage
      };

      if (isMobile) {
        config.devicePixelRatio = pixelRatio;
      }

      var script = document.createElement("script");
      script.src = buildUrl + "/b234ae88838de7f81e86dddcf1e3fda0.loader.js";
      script.onload = function () {
        createUnityInstance(canvas, config, showProgress)
          .then(function (unityInstance) {
            window.unityInstance = unityInstance;
            started = true;
            showProgress(1);
            loader.classList.add("finished");
            if (!tip.hidden) {
              scheduleTipHide();
            }
          })
          .catch(function (message) {
            showError(message);
          });
      };
      script.onerror = function () {
        showError("The 3D viewer's files couldn't be downloaded. Check your connection and try again.");
      };
      document.body.appendChild(script);

      document.getElementById("reload").addEventListener("click", function () {
        window.location.reload();
      });

      function tellUnityTheDevice(mobile, ratio) {
        try {
          var address = new URL(window.location.href);
          var device = mobile ? "mobile" : "desktop";
          var rounded = String(Math.round(ratio * 100) / 100);
          if (address.searchParams.get("device") === device && address.searchParams.get("ratio") === rounded) {
            return;
          }
          address.searchParams.set("device", device);
          address.searchParams.set("ratio", rounded);
          window.history.replaceState(window.history.state, "", address.toString());
        } catch (error) {
          return;
        }
      }

      function isUpright() {
        var type = screen.orientation && screen.orientation.type;
        if (typeof type === "string" && type.length > 0) {
          return type.indexOf("portrait") === 0;
        }
        if (typeof window.orientation === "number") {
          return window.orientation === 0 || window.orientation === 180;
        }
        return window.innerHeight > window.innerWidth;
      }

      function updateTip() {
        var upright = isUpright();
        if (upright === wasUpright) {
          return;
        }
        wasUpright = upright;
        if (upright && !tipClosed && texts.turnTip) {
          showTip();
        } else {
          hideTip();
        }
      }

      function showTip() {
        clearTimeout(tipTimer);
        tip.classList.remove("fading");
        tip.hidden = false;
        if (started) {
          scheduleTipHide();
        }
      }

      function scheduleTipHide() {
        clearTimeout(tipTimer);
        tipTimer = setTimeout(hideTip, 8000);
      }

      function hideTip() {
        clearTimeout(tipTimer);
        if (tip.hidden) {
          return;
        }
        tip.classList.add("fading");
        tipTimer = setTimeout(function () {
          tip.hidden = true;
          tip.classList.remove("fading");
        }, 360);
      }

      function readTipClosed() {
        try {
          return window.sessionStorage.getItem("turnTipClosed") === "1";
        } catch (error) {
          return false;
        }
      }

      function rememberTipClosed() {
        try {
          window.sessionStorage.setItem("turnTipClosed", "1");
        } catch (error) {
          return;
        }
      }

      function detectMobile() {
        var userAgent = navigator.userAgent || "";
        var touchFirst = !!(window.matchMedia && window.matchMedia("(hover: none) and (pointer: coarse)").matches);
        var mobileName = /Android|iPhone|iPad|iPod|Mobile|Silk|Kindle/i.test(userAgent);
        var iPadThatSaysMac = /Macintosh/.test(userAgent) && navigator.maxTouchPoints > 1;
        return touchFirst || mobileName || iPadThatSaysMac;
      }

      function showProgress(progress) {
        var value = Math.max(0, Math.min(1, progress || 0));
        barFill.style.width = (value * 100).toFixed(1) + "%";
        percentText.textContent = Math.round(value * 100) + "%";
        stateText.textContent = value < 0.9 ? "Loading" : "Starting";
      }

      function showMessage(message, type) {
        if (type === "error" && !started) {
          showError(message);
        } else if (type === "error") {
          console.error(message);
        } else {
          console.warn(message);
        }
      }

      function showError(message) {
        var text = String(message || "Unknown error.");
        if (/memory/i.test(text)) {
          text = "This device ran out of memory. Close other tabs or apps and try again. (" + text + ")";
        }
        document.getElementById("error-details").textContent = text;
        document.getElementById("loading-card").hidden = true;
        document.getElementById("error-card").hidden = false;
        loader.classList.remove("finished");
      }
    })();
  </script>
</body>
</html>
