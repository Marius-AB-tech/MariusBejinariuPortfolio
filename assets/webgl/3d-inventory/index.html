<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Fill the screen on phones, never let the page itself zoom, and let the dark
       background reach behind the notch (the 3D view itself stays clear of it). -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0d">
  <title>3Dinventory</title>

  <!-- The portfolio's fonts. If they can't load, similar built-in fonts are used instead. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Space+Mono:wght@400;700&display=swap">

  <style>
    /* ---------- Colours (change them here) ---------- */
    :root {
      --bg: #0b0b0d;          /* near-black page */
      --text: #f4f1ee;        /* off-white text */
      --muted: #a29d99;       /* grey text */
      --red: #ff1a3c;         /* portfolio red */
      --salmon: #ff8a7a;      /* start of the salmon-to-red gradient */
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      overflow: hidden;              /* the page never scrolls; only the 3D view moves */
      overscroll-behavior: none;     /* no pull-to-refresh or rubber-band bounce */
    }

    body {
      color: var(--text);
      font-family: "Space Mono", ui-monospace, Menlo, Consolas, monospace;
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
    }

    /* The area the 3D view fills: the whole window, minus any notch or home-bar area. */
    #stage {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      top: env(safe-area-inset-top, 0px);
      right: env(safe-area-inset-right, 0px);
      bottom: env(safe-area-inset-bottom, 0px);
      left: env(safe-area-inset-left, 0px);
    }

    #unity-canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: var(--bg);
      outline: none;
      touch-action: none;            /* drags and pinches go to the 3D view, not the browser */
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;   /* no "save image" pop-up on a long press */
    }

    /* ---------- Loading screen ---------- */
    #loader {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
      background:
        radial-gradient(120% 80% at 50% 115%, rgba(255, 26, 60, 0.18), rgba(255, 26, 60, 0) 60%),
        var(--bg);
      transition: opacity 0.45s ease, visibility 0.45s ease;
    }

    #loader.finished {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .card {
      width: 100%;
      max-width: 360px;
      text-align: center;
    }

    .kicker {
      margin: 0 0 10px;
      font-size: 11px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--salmon);
    }

    .title {
      margin: 0 0 24px;
      font-family: "Playfair Display", Georgia, "Times New Roman", serif;
      font-weight: 600;
      font-size: clamp(24px, 6vw, 34px);
      line-height: 1.15;
      color: var(--text);
    }

    .bar {
      position: relative;
      height: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.09);
      overflow: hidden;
    }

    .bar-fill {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--salmon), var(--red));
      box-shadow: 0 0 14px rgba(255, 26, 60, 0.55);
      transition: width 0.25s ease;
    }

    .status {
      display: flex;
      justify-content: space-between;
      margin: 12px 0 0;
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .hint {
      margin: 28px 0 0;
      font-size: 11px;
      line-height: 1.7;
      color: var(--muted);
    }

    /* ---------- Error message ---------- */
    .error .kicker { color: var(--red); }

    .error-details {
      margin: 0 0 22px;
      font-size: 12px;
      line-height: 1.6;
      color: var(--muted);
      word-break: break-word;
    }

    .button {
      display: inline-block;
      padding: 12px 22px;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--salmon), var(--red));
      box-shadow: 0 10px 24px -10px rgba(255, 26, 60, 0.7);
      color: #fff;
      font: 700 12px/1 "Space Mono", ui-monospace, Menlo, Consolas, monospace;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
    }

    [hidden] { display: none !important; }

    @media (prefers-reduced-motion: reduce) {
      #loader, .bar-fill { transition: none; }
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
  </div>

  <div id="loader" role="status" aria-live="polite">
    <!-- Shown while loading -->
    <div class="card" id="loading-card">
      <p class="kicker">Interactive 3D</p>
      <h1 class="title" id="title"></h1>
      <div class="bar" aria-hidden="true"><div class="bar-fill" id="bar-fill"></div></div>
      <p class="status"><span id="state">Loading</span><span id="percent">0%</span></p>
      <p class="hint" id="hint"></p>
    </div>

    <!-- Shown only if something goes wrong -->
    <div class="card error" id="error-card" hidden>
      <p class="kicker">Something went wrong</p>
      <h1 class="title">The 3D viewer couldn't start</h1>
      <p class="error-details" id="error-details"></p>
      <button class="button" type="button" id="reload">Try again</button>
    </div>
  </div>

  <script>
    (function () {
      "use strict";

      var canvas = document.getElementById("unity-canvas");
      var loader = document.getElementById("loader");
      var barFill = document.getElementById("bar-fill");
      var stateText = document.getElementById("state");
      var percentText = document.getElementById("percent");
      var started = false; // becomes true once the 3D view is running

      var productName = "3Dinventory";
      document.getElementById("title").textContent = productName;

      // ---------------------------------------------------------------
      // 1. Phone/tablet or computer?
      //    Phones and tablets get lighter settings and their own textures.
      // ---------------------------------------------------------------
      var isMobile = detectMobile();
      tellUnityTheDevice(isMobile);

      document.getElementById("hint").textContent = isMobile
        ? "Drag to turn \u00b7 Pinch to zoom \u00b7 Double-tap to reset"
        : "Drag to turn \u00b7 Scroll to zoom \u00b7 Double-click to reset";

      if (isMobile) {
        // Stop the browser zooming the page or showing menus while you use the 3D view.
        document.addEventListener("gesturestart", function (event) { event.preventDefault(); }, { passive: false });
        canvas.addEventListener("contextmenu", function (event) { event.preventDefault(); });
      }

      // ---------------------------------------------------------------
      // 2. The build files Unity made (names filled in when you build).
      // ---------------------------------------------------------------
      var buildUrl = "Build";
      var dataFile = "3D inventory v44 WEbgl export.data.unityweb";
      // The "Build Desktop + Mobile" tool adds the phone textures as "<name>-mobile.data...".
      var mobileDataFile = dataFile.replace(/\.data(\.[A-Za-z0-9]+)?$/, "-mobile.data$1");

      var config = {
        dataUrl: buildUrl + "/" + dataFile,
        frameworkUrl: buildUrl + "/3D inventory v44 WEbgl export.framework.js.unityweb",
        codeUrl: buildUrl + "/3D inventory v44 WEbgl export.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: productName,
        productVersion: "0.1.0",
        showBanner: showMessage
      };

      // Phones: draw at most 2 pixels per screen point. Their screens have 3, which looks
      // almost the same but costs over twice the work. (Computers keep the browser's setting.)
      if (isMobile) {
        config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);
      }

      // ---------------------------------------------------------------
      // 3. Pick the textures file, then start Unity.
      // ---------------------------------------------------------------
      chooseDataUrl().then(function (dataUrl) {
        config.dataUrl = dataUrl;

        var script = document.createElement("script");
        script.src = buildUrl + "/3D inventory v44 WEbgl export.loader.js";
        script.onload = function () {
          createUnityInstance(canvas, config, showProgress)
            .then(function (unityInstance) {
              window.unityInstance = unityInstance; // handy for testing in the browser console
              started = true;
              showProgress(1);
              loader.classList.add("finished");
            })
            .catch(function (message) {
              showError(message);
            });
        };
        script.onerror = function () {
          showError("The 3D viewer's files couldn't be downloaded. Check your connection and try again.");
        };
        document.body.appendChild(script);
      });

      document.getElementById("reload").addEventListener("click", function () {
        window.location.reload();
      });

      // ===============================================================
      // Helpers
      // ===============================================================

      // Same rules as the portfolio embed script, so both always agree.
      function detectMobile() {
        var userAgent = navigator.userAgent || "";
        var touchFirst = !!(window.matchMedia && window.matchMedia("(hover: none) and (pointer: coarse)").matches);
        var mobileName = /Android|iPhone|iPad|iPod|Mobile|Silk|Kindle/i.test(userAgent);
        var iPadThatSaysMac = /Macintosh/.test(userAgent) && navigator.maxTouchPoints > 1;
        return touchFirst || mobileName || iPadThatSaysMac;
      }

      // Unity reads "?device=mobile" or "?device=desktop" from the page address (see WebDevice in PhoneOptimizer.cs).
      // It's always set from this page's own check, so a shared link can't force the wrong one.
      function tellUnityTheDevice(mobile) {
        try {
          var address = new URL(window.location.href);
          var wanted = mobile ? "mobile" : "desktop";
          if (address.searchParams.get("device") === wanted) {
            return;
          }
          address.searchParams.set("device", wanted);
          window.history.replaceState(window.history.state, "", address.toString());
        } catch (error) {
          // Not allowed here (for example, opened as a local file). Unity then makes its own guess.
        }
      }

      // Phones and tablets that understand ASTC textures get the mobile file, if it exists.
      // Everyone else gets the normal (desktop) file, which works everywhere.
      function chooseDataUrl() {
        var desktopUrl = buildUrl + "/" + dataFile;
        if (!isMobile || mobileDataFile === dataFile || !supportsAstcTextures()) {
          return Promise.resolve(desktopUrl);
        }

        var mobileUrl = buildUrl + "/" + mobileDataFile;
        return fetch(mobileUrl, { method: "HEAD", cache: "no-store" })
          .then(function (response) { return response.ok ? mobileUrl : desktopUrl; })
          .catch(function () { return desktopUrl; });
      }

      function supportsAstcTextures() {
        try {
          var testCanvas = document.createElement("canvas");
          var gl = testCanvas.getContext("webgl2") || testCanvas.getContext("webgl");
          if (!gl) {
            return false;
          }
          var supported = !!gl.getExtension("WEBGL_compressed_texture_astc");
          var loseContext = gl.getExtension("WEBGL_lose_context");
          if (loseContext) {
            loseContext.loseContext(); // free it straight away (phones allow only a few)
          }
          return supported;
        } catch (error) {
          return false;
        }
      }

      function showProgress(progress) {
        var value = Math.max(0, Math.min(1, progress || 0));
        barFill.style.width = (value * 100).toFixed(1) + "%";
        percentText.textContent = Math.round(value * 100) + "%";
        stateText.textContent = value < 0.9 ? "Loading" : "Starting";
      }

      // Unity calls this with warnings and errors. Warnings go to the browser console only,
      // and so do errors once the 3D view is running (so a small problem never covers it up).
      function showMessage(message, type) {
        if (type === "error" && !started) {
          showError(message);
        } else if (type === "error") {
          console.error(message);
        } else {
          console.warn(message);
        }
      }

      function showError(message) {
        var text = String(message || "Unknown error.");
        if (/memory/i.test(text)) {
          text = "This device ran out of memory. Close other tabs or apps and try again. (" + text + ")";
        }
        document.getElementById("error-details").textContent = text;
        document.getElementById("loading-card").hidden = true;
        document.getElementById("error-card").hidden = false;
        loader.classList.remove("finished");
      }
    })();
  </script>
</body>
</html>
